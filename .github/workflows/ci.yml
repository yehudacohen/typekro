name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # TODO: pin to SHA for supply chain security

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.x'

      # The packed-import and runtime checks run under Node; TypeKro requires Node >= 22.19.0.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        id: build
        run: bun run build

      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run lint

      - name: Docs validation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bun run docs:validate
          bun run docs:check-lines
          bun run docs:check-examples
          bun run docs:check-links
          bun run docs:build

      - name: Circular dependency check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bunx madge --circular --extensions ts src/

      - name: Effect dependency cohort
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run check:effect-cohort

      - name: Packed artifact budgets and imports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:packed-imports

      - name: Declaration budgets per owner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run check:declaration-budgets

      - name: Public API snapshot
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run check:public-api

      - name: Randomized unit test isolation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:randomized

      - name: Unit tests with coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:coverage

      - name: Integration YAML tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:integration:yaml

      - name: NATS operator accounts (real NATS server)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker pull nats:2.14.0-alpine
          bun run test:integration:nats-operator

      - name: HyperDX OIDC plugin bundle is current
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run check:hyperdx-oidc-plugin

      - name: HyperDX OIDC login test (real HyperDX image)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:integration:hyperdx-oidc

      - name: HyperDX Team defaults test (real HyperDX image)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:integration:hyperdx-team-defaults

      - name: ClickHouse server boot test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:integration:clickhouse-boot

      - name: ClickStack queue storage test (real collector image)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:integration:clickstack-queue

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  node-runtime:
    # The supported Node.js range starts at 22.19.0 (the floor of undici 8, which
    # @kubernetes/client-node 2 uses). Check the floor and the current LTS: the packed package
    # imports cleanly, and the Kubernetes transport works over mutual TLS.
    name: node-runtime (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', 'lts/*']
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # TODO: pin to SHA for supply chain security

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Packed imports under Node
        run: node --version && node scripts/test-packed-imports.mjs

      - name: Kubernetes transport over mutual TLS under Node
        run: node scripts/test-node-kubernetes-tls.mjs

      - name: Container build runtime under Node
        run: node scripts/test-container-node-runtime.mjs

  alchemy-kubernetes-capture:
    # The capture tool has its own package.json and bun.lock (it pins Alchemy and Effect versions
    # TypeKro does not use), so it is installed and checked on its own.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/alchemy-kubernetes-capture
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # TODO: pin to SHA for supply chain security

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The tool's lockfile is written by Bun 1.3.
          bun-version: '1.3.10'

      - name: Install TypeKro's dependencies (Biome, which formats the generated output)
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Install the tool's dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The OS sandbox `test:offline` uses is macOS-only. On Linux the tests run with the tool's
      # application-level guard preloaded, which refuses sockets, DNS, fetch and HTTP in-process.
      # That includes test/drift.test.ts, which recaptures from Alchemy and fails unless the
      # regenerated output is byte-identical to the checked-in files.
      - name: Offline tests and drift check
        run: bun run test:guarded
