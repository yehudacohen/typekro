name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # TODO: pin to SHA for supply chain security

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.x'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        id: build
        run: bun run build

      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run lint

      - name: Docs validation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bun run docs:validate
          bun run docs:check-lines
          bun run docs:check-examples
          bun run docs:check-links
          bun run docs:build

      - name: Circular dependency check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bunx madge --circular --extensions ts src/

      - name: Effect dependency cohort
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run check:effect-cohort

      - name: Packed artifact budgets and imports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:packed-imports

      - name: Randomized unit test isolation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:randomized

      - name: Unit tests with coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:coverage

      - name: Integration YAML tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:integration:yaml

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
